<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480"><title id="banner-title">VGC Rulebreak</title><desc id="banner-description">VGC Rulebreak uses Pokémon Showdown to study how competitive agents handle rule changes. Its first question asks what happens when Protect drops from 16 PP to 8 PP.</desc><defs id="banner-definitions"><linearGradient id="ground-gradient" x1="0" y1="0" x2="1" y2="1"><stop id="ground-start" offset="0%" stop-color="#211936" /><stop id="ground-end" offset="100%" stop-color="#111225" /></linearGradient></defs><rect id="banner-ground" x="0" y="0" width="1600" height="480" fill="url(#ground-gradient)" /><line id="frame-top" x1="40" y1="28" x2="1560" y2="28" stroke="#4A3F73" stroke-width="2" opacity="0.7" /><line id="frame-bottom" x1="40" y1="452" x2="1560" y2="452" stroke="#4A3F73" stroke-width="2" opacity="0.7" /><g id="brand-lockup"><text id="brand-wordmark" x="88" y="156" fill="#FFFFFF" font-family="Chakra Petch, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="2.5">VGC RULEBREAK</text><text id="brand-description" x="91" y="217" fill="#FFFFFF" font-family="Chakra Petch, Arial, sans-serif" font-size="31" font-weight="500">How do competitive agents handle new rules?</text><line id="brand-divider" x1="91" y1="289" x2="750" y2="289" stroke="#5B4D82" stroke-width="2" /><text id="rule-name" x="91" y="350" fill="#FFFFFF" font-family="Chakra Petch, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="0">First question: Protect</text><text id="showdown-method" x="91" y="258" fill="#B9B2D6" font-family="Chakra Petch, Arial, sans-serif" font-size="24" font-weight="500">Agent experiments in Pokémon Showdown</text><text id="source-capacity-label" x="425" y="350" fill="#FF9F2E" font-family="Chakra Petch, Arial, sans-serif" font-size="29" font-weight="700">16 PP</text><path id="rule-direction" d="M530 340 H572 M558 326 L573 340 L558 354" stroke="#C8F542" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter" fill="none" /><text id="target-capacity-label" x="598" y="350" fill="#45D6EE" font-family="Chakra Petch, Arial, sans-serif" font-size="29" font-weight="700">8 PP</text></g><g id="protect-shield"><path id="shield-left" d="M1090 74 H1207 L1195 142 L1218 211 L1196 274 L1212 341 L1207 406 H1090 L972 240 Z" fill="#302039" stroke="#FF9F2E" stroke-width="4" stroke-linejoin="round" /><path id="shield-right" d="M1223 74 H1340 L1458 240 L1340 406 H1223 L1228 341 L1212 274 L1234 211 L1211 142 Z" fill="#1A2B42" stroke="#45D6EE" stroke-width="4" stroke-linejoin="round" /><text id="shield-source-count" x="1123" y="223" text-anchor="middle" fill="#FF9F2E" font-family="Chakra Petch, Arial, sans-serif" font-size="99" font-weight="700">16</text><text id="shield-target-count" x="1300" y="223" text-anchor="middle" fill="#45D6EE" font-family="Chakra Petch, Arial, sans-serif" font-size="99" font-weight="700">8</text><text id="shield-source-unit" x="1123" y="250" text-anchor="middle" fill="#E4E1FF" font-family="Chakra Petch, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">PP</text><text id="shield-target-unit" x="1300" y="250" text-anchor="middle" fill="#E4E1FF" font-family="Chakra Petch, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">PP</text><g id="shield-source-cells"><polygon id="shield-source-cell-01" points="1091.0,276.0 1086.0,284.7 1076.0,284.7 1071.0,276.0 1076.0,267.3 1086.0,267.3" fill="#FF9F2E" opacity="0.92" /><polygon id="shield-source-cell-02" points="1119.0,276.0 1114.0,284.7 1104.0,284.7 1099.0,276.0 1104.0,267.3 1114.0,267.3" fill="#FF9F2E" opacity="0.92" /><polygon id="shield-source-cell-03" points="1147.0,276.0 1142.0,284.7 1132.0,284.7 1127.0,276.0 1132.0,267.3 1142.0,267.3" fill="#FF9F2E" opacity="0.92" /><polygon id="shield-source-cell-04" points="1175.0,276.0 1170.0,284.7 1160.0,284.7 1155.0,276.0 1160.0,267.3 1170.0,267.3" fill="#FF9F2E" opacity="0.92" /><polygon id="shield-source-cell-05" points="1091.0,302.0 108